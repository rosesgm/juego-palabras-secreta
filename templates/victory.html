<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Desmadre Multiversal - ¡Ganaste!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .victory-box {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            width: 450px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,.3);
            animation: popIn 0.6s cubic-bezier(.36,1.56,.64,1) both;
        }
        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to   { transform: scale(1);   opacity: 1; }
        }
        .trophy { font-size: 80px; animation: bounce 1s infinite alternate; }
        @keyframes bounce {
            from { transform: translateY(0); }
            to   { transform: translateY(-15px); }
        }
        .victory-title {
            color: #243b55;
            font-size: 28px;
            font-weight: bold;
            margin: 10px 0 5px;
        }
        .victory-sub {
            color: #666;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .btn-play-again {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn-play-again:hover { background: #1b5e20; }
        canvas#confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>

    <div style="display:flex; flex-direction:column; gap:20px; align-items:center;">

        <div style="background:white; padding:15px; border-radius:15px; width:450px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.3);">
            <h1 style="color:#243b55; font-size:24px; margin:0;">Desmadre Multiversal</h1>
        </div>

        <div class="victory-box">
            <img src="{{ url_for('static', filename='imagenes/fondo_login/mil_besitos.png') }}" style="width: 250px; border-radius: 50%; animation: bounce 1s infinite alternate;">
            <h2 class="victory-title">¡Lo lograste, {{ current_user.name }}!</h2>
            <p class="victory-sub">Completaste todos los niveles del Desmadre Multiversal.<br>Eres un verdadero crack del multiverso.</p>

            <button class="btn-play-again" onclick="window.location.href='/game'">
                 Jugar de nuevo
            </button>

            <div style="border-top:1px solid #ddd; padding-top:15px; margin-top:5px;">
                <a href="#" id="btn-logout" style="color:#d9534f; text-decoration:none; font-size:14px; font-weight:bold;">
                    Cerrar Sesión
                </a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const colors = ['#f44336','#e91e63','#9c27b0','#3f51b5','#2196f3','#00bcd4','#4caf50','#ffeb3b','#ff9800'];
        const pieces = Array.from({length: 120}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * -canvas.height,
            w: Math.random() * 10 + 6,
            h: Math.random() * 6 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            speed: Math.random() * 3 + 2,
            angle: Math.random() * 360,
            spin: (Math.random() - 0.5) * 4
        }));

        let running = true;
        function draw() {
            if (!running) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pieces.forEach(p => {
                ctx.save();
                ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
                ctx.rotate(p.angle * Math.PI / 180);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                ctx.restore();
                p.y += p.speed;
                p.angle += p.spin;
                if (p.y > canvas.height) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }
            });
            requestAnimationFrame(draw);
        }
        draw();

        setTimeout(() => running = false, 6000);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="{{ url_for('static', filename='js/logout.js') }}"></script>
</body>
</html>
